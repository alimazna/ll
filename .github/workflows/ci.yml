name: XAUUSD Sovereign CI

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libcurl4-openssl-dev python3

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXAUUSD_BUILD_UI=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: xauusd-build
          path: |
            build/CTestTestfile.cmake
            build/**/test_*
            build/**/Phase*IntegrationTests
          if-no-files-found: warn
