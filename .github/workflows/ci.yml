```yaml
name: XAUUSD Sovereign CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  build-linux:

    name: Linux Build And Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            curl \
            libcurl4-openssl-dev \
            python3


      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXAUUSD_BUILD_UI=OFF \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DGLFW_BUILD_X11=OFF


      - name: Build
        run: |
          cmake --build build --parallel


      - name: Run Tests
        run: |
          ctest \
            --test-dir build \
            --output-on-failure \
            --parallel 2


      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-linux-release
          path: |
            build/
            

  build-windows:

    name: Windows Release Build
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Dependencies
        run: |
          choco install cmake ninja -y


      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DXAUUSD_BUILD_UI=OFF


      - name: Build
        run: |
          cmake --build build --config Release --parallel


      - name: Run Tests
        run: |
          ctest `
            --test-dir build `
            -C Release `
            --output-on-failure `
            --parallel 2


      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-windows-release
          path: |
            build/Release/
```
